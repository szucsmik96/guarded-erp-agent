name: evals

# Manual only. Needs the LLM_API_KEY repository secret. Works with any OpenAI-compatible endpoint:
#   OpenAI   https://api.openai.com/v1                                  (paid)
#   Gemini   https://generativelanguage.googleapis.com/v1beta/openai/   (free tier)
on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: OpenAI-compatible endpoint
        default: https://api.openai.com/v1
      model:
        description: Model name
        default: gpt-5-mini
      runs:
        description: Runs per scenario
        default: "3"

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build GuardedErp.slnx
      - name: Run evals
        env:
          Llm__ApiKey: ${{ secrets.LLM_API_KEY }}
          Llm__Endpoint: ${{ inputs.endpoint }}
          Llm__Model: ${{ inputs.model }}
          RUNS: ${{ inputs.runs }}
        run: dotnet run --project src/ErpAgent.Evals --no-build -- --runs "$RUNS"
      - name: Publish report to the run summary
        if: always()
        run: cat evals/results/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No report written." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/results/
          if-no-files-found: ignore
